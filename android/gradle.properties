# JVM settings - safe for 8 GB RAM
org.gradle.jvmargs=-Xmx3g -Xms1g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX / Jetifier (keep these)
android.useAndroidX=true
android.enableJetifier=true

# Optional: faster builds
org.gradle.parallel=true
org.gradle.caching=true